        function generateFAQAccordion(faqs, containerId) {
            const accordionContainer = document.getElementById(containerId);

            if (!accordionContainer) {
                console.error('FAQ accordion container not found');
                return;
            }

            // Clear existing content
            accordionContainer.innerHTML = '';

            faqs.forEach((faq, index) => {
                const itemNumber = String(index + 1).padStart(2, '0');
                const activeClass = faq.active ? 'active-accordion' : '';
                const collapseClass = faq.active ? 'show' : '';
                const icon = faq.active ? 'icon-feather-minus' : 'icon-feather-plus';
                const borderClass = (index === faqs.length - 1) ? '' : 'border-bottom border-color-light-medium-gray';
                const ariaExpanded = faq.active ? 'true' : 'false';

                const accordionItem = `
                <div class="accordion-item ${activeClass} ${borderClass}">
                    <div class="accordion-header">
                        <a href="#" data-bs-toggle="collapse" data-bs-target="#accordion-${containerId}-${itemNumber}" aria-expanded="${ariaExpanded}" data-bs-parent="#${containerId}">
                            <div class="accordion-title mb-0 position-relative text-gray-3 pe-30px">
                                <i class="feather ${icon} icon-extra-medium"></i><span class="fw-500 fs-18">${faq.question}</span>
                            </div>
                        </a>
                    </div>
                    <div id="accordion-${containerId}-${itemNumber}" class="accordion-collapse collapse ${collapseClass}" data-bs-parent="#${containerId}">
                        <div class="accordion-body last-paragraph-no-margin">
                            <p class="text-gray-4 fs-16 fw-500">${faq.answer}</p>
                        </div>
                    </div>
                </div>
            `;

                accordionContainer.insertAdjacentHTML('beforeend', accordionItem);
            });
        }

        // Initialize FAQ accordion when DOM is loaded
        document.addEventListener('DOMContentLoaded', function () {
            // Generate patient FAQs initially
            generateFAQAccordion(patientFaqs, 'patient-accordion');
            // Handle tab switching
            const tabButtons = document.querySelectorAll('.faq-btns');
            tabButtons.forEach(button => {
                button.addEventListener('shown.bs.tab', function (event) {
                    const targetId = event.target.getAttribute('id');
                    // Load appropriate FAQ data based on selected tab
                    if (targetId === 'patient-tab') {
                        generateFAQAccordion(patientFaqs, 'patient-accordion');
                    } else {
                        generateFAQAccordion(doctorFaqs, 'doctor-accordion');
                    }
                });
            });
