<!doctype html>
<html class="no-js" lang="en">
    <head>
        <title>{% block title %}HealR{% endblock %}</title>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="author" content="HealR">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta name="description" content="{% block description %}HealR - Your trusted telemedicine platform for patients and doctors.{% endblock %}">
        <!-- favicon icon -->
        <link rel="shortcut icon" href="{% static 'assets/img/logo/fav.svg' %}">
        <link rel="apple-touch-icon" href="{% static 'assets/img/logo/fav.svg' %}">
        <link rel="apple-touch-icon" sizes="72x72" href="{% static 'assets/img/logo/fav.svg' %}">
        
        <!-- style sheets and font icons  -->
        <link rel="stylesheet" href="{% static 'assets/css/vendors.min.css' %}">
        <link rel="stylesheet" href="{% static 'assets/css/icon.min.css' %}">
        <link rel="stylesheet" href="{% static 'assets/css/style.min.css' %}">
        <link rel="stylesheet" href="{% static 'assets/css/responsive.min.css' %}">
        
        {% block extra_css %}{% endblock %}
        
    </head>
    <body>
    
    <!-- Header Component -->
    <div id="header-component"></div>

    <!-- Main Content -->
    {% block content %}{% endblock %}

    <!-- Footer Component -->
    <div id="footer-component"></div>

    <!-- Scripts -->
    <script type="text/javascript" src="{% static 'assets/js/jquery.js' %}"></script>
    <script type="text/javascript" src="{% static 'assets/js/vendors.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'assets/js/main.js' %}"></script>
    <script type="text/javascript" src="{% static 'assets/js/components.js' %}"></script>
    
    {% block extra_js %}{% endblock %}
    </body>
</html>
