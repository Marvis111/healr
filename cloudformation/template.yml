AWSTemplateFormatVersion: 2010-09-09
Description: 'CloudFormation template for a static website hosted on S3 with CloudFront'

Parameters:
  Env:
    Type: String
    Description: "Environment (dev/prod)"
  ProjectId:
    Type: String
    Description: "Project ID"
  DomainName:
    Type: String
    Default: ""
    Description: "Comma-separated custom domain names"
  ACMCertificate:
    Type: String
    Default: ""
    Description: "ACM certificate ARN"
  AttachCNAME:
    Type: String
    Default: "false"
    Description: "Set to true to attach custom domain and ACM certificate"

Conditions:
  UseCNAMEAlias: !And 
    - !Equals [!Ref AttachCNAME, "true"]
    - !Not [!Equals [!Ref DomainName, ""]]

Resources:

  # S3 Bucket for the static website
  S3WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectId}-${Env}-${AWS::AccountId}"

  # Origin Access Identity for CloudFront
  CloudFrontOriginIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: "Origin access identity for ${ProjectId}-${Env}"

  # S3 bucket policy to allow CloudFront read access
  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${CloudFrontOriginIdentity}"
            Action:
              - s3:GetObject
            Resource: !Sub "arn:aws:s3:::${S3WebsiteBucket}/*"

  # Lambda function for URL rewriting (optional)
  URLRewriteFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs16.x
      MemorySize: 128
      Role: !GetAtt URLRewriteFunctionExecutionRole.Arn
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            const request = event.Records[0].cf.request;
            const uri = request.uri;

            if (uri.match(/\/[^/.]+$/)) {
              if (uri.startsWith('/doctor/')) {
                request.uri = '/doctor/profile.html';
              } else {
                request.uri = uri + '.html';
              }
              return request;
            }

            if (uri.match(/.+\/$/)) {
              request.uri = uri + 'index.html';
              return request;
            }

            // Serve .well-known files for assetlinks.json and apple-app-site-association
            if (
              uri === "/.well-known/assetlinks.json" ||
              uri === "/.well-known/apple-app-site-association"
            ) {
              // Only allow these filenames, otherwise treat as not found
              const safeFilenames = ["assetlinks.json", "apple-app-site-association"];
              const filename = uri.split("/").pop();

              if (!safeFilenames.includes(filename)) {
                // If not an allowed file, just return the original request
                return request;
              }

              // Build the full file path
              const path = require('path');
              const fs = require('fs');

              const wellKnownDir = path.join(__dirname, '.well-known');
              const filePath = path.join(wellKnownDir, filename);

              try {
                const body = fs.readFileSync(filePath, "utf8");
                return {
                  status: '200',
                  statusDescription: 'OK',
                  headers: {
                    'cache-control': [{ key: 'Cache-Control', value: 'public, max-age=3600' }],
                    'content-type': [{ key: 'Content-Type', value: 'application/json' }],
                  },
                  body: body,
                  bodyEncoding: 'text',
                };
              } catch (e) {
                // If the file doesn't exist, return a 404
                return {
                  status: '404',
                  statusDescription: 'Not Found',
                  headers: {
                    'content-type': [{ key: 'Content-Type', value: 'application/json' }],
                  },
                  body: JSON.stringify({ error: "File not found" }),
                  bodyEncoding: 'text'
                };
              }
            }
            return request;
          };

  URLRewriteFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - edgelambda.amazonaws.com
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # CloudFront distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectId}-${Env}-distribution"
        DefaultRootObject: index.html
        Origins:
          - Id: !Ref S3WebsiteBucket
            DomainName: !GetAtt S3WebsiteBucket.DomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOriginIdentity}"
        DefaultCacheBehavior:
          TargetOriginId: !Ref S3WebsiteBucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          LambdaFunctionAssociations:
            - EventType: origin-request
              LambdaFunctionARN: !GetAtt URLRewriteFunction.Arn
        Aliases: !If [UseCNAMEAlias, !Split [",", !Ref DomainName], !Ref "AWS::NoValue"]
        ViewerCertificate:
          AcmCertificateArn: !If [UseCNAMEAlias, !Ref ACMCertificate, !Ref "AWS::NoValue"]
          CloudFrontDefaultCertificate: !If [UseCNAMEAlias, !Ref "AWS::NoValue", true]
          SslSupportMethod: !If [UseCNAMEAlias, "sni-only", !Ref "AWS::NoValue"]
        HttpVersion: http2
        PriceClass: PriceClass_100
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /index.html

Outputs:
  S3BucketName:
    Value: !Ref S3WebsiteBucket
    Description: "S3 Bucket Name"

  CloudFrontDistributionID:
    Value: !Ref CloudFrontDistribution
    Description: "CloudFront Distribution ID"

  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
    Description: "CloudFront Domain Name"