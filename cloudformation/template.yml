AWSTemplateFormatVersion: 2010-09-09
Description: HealR static landing page (S3 + CloudFront + Lambda@Edge) - in-place update safe

Parameters:
  Env:
    Type: String
    Description: Deployment environment (dev, prod)

  ProjectId:
    Type: String
    Description: Project identifier

  DomainName:
    Type: String
    Default: ""
    Description: Comma-separated domain names (healr.ng,www.healr.ng)

  ACMCertificate:
    Type: String
    Default: ""
    Description: ACM certificate ARN (must be in us-east-1 for CloudFront)

Conditions:
  UseCustomDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:

  ############################################################
  # S3 Bucket (Private)
  ############################################################

  S3WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectId}-${Env}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ############################################################
  # CloudFront Origin Access Identity
  ############################################################

  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub "${ProjectId}-${Env}-OAI"

  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${CloudFrontOAI}"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${S3WebsiteBucket}/*"

  ############################################################
  # Lambda@Edge Rewrite Function
  ############################################################

  RewriteFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - edgelambda.amazonaws.com
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  RewriteFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: HealR URI rewrite for static routing
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt RewriteFunctionRole.Arn
      MemorySize: 128
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            const request = event.Records[0].cf.request;
            const uri = request.uri;

            if (uri.match(/\/[^/.]+$/)) {
              if (uri.startsWith('/doctor/')) {
                request.uri = '/doctor/profile.html';
              } else {
                request.uri = uri + '.html';
              }
              return request;
            }

            if (uri.match(/.+\/$/)) {
              request.uri = uri + 'index.html';
              return request;
            }

            // Serve .well-known files for assetlinks.json and apple-app-site-association
            if (
              uri === "/.well-known/assetlinks.json" ||
              uri === "/.well-known/apple-app-site-association"
            ) {
              // Only allow these filenames, otherwise treat as not found
              const safeFilenames = ["assetlinks.json", "apple-app-site-association"];
              const filename = uri.split("/").pop();

              if (!safeFilenames.includes(filename)) {
                // If not an allowed file, just return the original request
                return request;
              }

              // Build the full file path
              const path = require('path');
              const fs = require('fs');

              const wellKnownDir = path.join(__dirname, '.well-known');
              const filePath = path.join(wellKnownDir, filename);

              try {
                const body = fs.readFileSync(filePath, "utf8");
                return {
                  status: '200',
                  statusDescription: 'OK',
                  headers: {
                    'cache-control': [{ key: 'Cache-Control', value: 'public, max-age=3600' }],
                    'content-type': [{ key: 'Content-Type', value: 'application/json' }],
                  },
                  body: body,
                  bodyEncoding: 'text',
                };
              } catch (e) {
                // If the file doesn't exist, return a 404
                return {
                  status: '404',
                  statusDescription: 'Not Found',
                  headers: {
                    'content-type': [{ key: 'Content-Type', value: 'application/json' }],
                  },
                  body: JSON.stringify({ error: "File not found" }),
                  bodyEncoding: 'text'
                };
              }
            }
            return request;
          };
  RewriteFunctionVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref RewriteFunction

  ############################################################
  # CloudFront Distribution (In-Place Update Safe)
  ############################################################

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectId}-${Env}-distribution"
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100

        # Use same aliases as current distribution
        Aliases: !If
          - UseCustomDomain
          - !Split [",", !Ref DomainName]
          - !Ref "AWS::NoValue"

        Origins:
          - Id: !Ref S3WebsiteBucket   # Matches existing distribution
            DomainName: !GetAtt S3WebsiteBucket.DomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOAI}"

        DefaultCacheBehavior:
          TargetOriginId: !Ref S3WebsiteBucket   # Matches existing distribution
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS

          # Managed policies
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf

          LambdaFunctionAssociations:
            - EventType: origin-request
              LambdaFunctionARN: !Ref RewriteFunctionVersion

        ViewerCertificate:
          AcmCertificateArn: !If
            - UseCustomDomain
            - !Ref ACMCertificate
            - !Ref "AWS::NoValue"
          CloudFrontDefaultCertificate: !If
            - UseCustomDomain
            - !Ref "AWS::NoValue"
            - true
          SslSupportMethod: !If
            - UseCustomDomain
            - sni-only
            - !Ref "AWS::NoValue"

Outputs:
  CloudfrontDistID:
    Value: !Ref CloudFrontDistribution

  CloudfrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName

  S3BucketName:
    Value: !Ref S3WebsiteBucket