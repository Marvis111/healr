AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFront distribution for static website hosting with www record support

Parameters:
  DomainName:
    Description: Domain names for your website (e.g., healr.ng,www.healr.ng)
    Type: String
    Default: ""
  ACMCertificate:
    Description: ACM Certificate ARN (must be in us-east-1 for CloudFront)
    Type: String
  S3BucketName:
    Description: S3 bucket name for static website content
    Type: String
  CloudfrontComment:
    Description: Comment for CloudFront distribution
    Type: String
    Default: Static website distribution

Conditions:
  UseCNAMEAlias: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  CloudfrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases: !If [UseCNAMEAlias, !Split [",", !Ref DomainName], !Ref "AWS::NoValue"]
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        Origins:
          - Id: S3Origin
            DomainName: !Sub "${S3BucketName}.s3.amazonaws.com"
            S3OriginConfig: {}
        ViewerCertificate:
          AcmCertificateArn: !Ref ACMCertificate
          SslSupportMethod: sni-only
        Comment: !Ref CloudfrontComment
        HttpVersion: http2

  WWWRecordSet:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: healr.ng.    # NOTE: trailing dot is required
      Name: www.healr.ng.          # NOTE: trailing dot is required
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudfrontDistribution.DomainName
        HostedZoneId: Z00993721ZVFM3W5CEUYM  # global CloudFront hosted zone ID

Outputs:
  CloudFrontDistributionID:
    Description: CloudFront Distribution ID
    Value: !Ref CloudfrontDistribution

  CloudFrontDomainName:
    Description: CloudFront Domain Name
    Value: !GetAtt CloudfrontDistribution.DomainName