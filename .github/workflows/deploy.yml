name: Deploy HealR Landingpage

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        type: choice
        options:
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHub-OIDC

      - name: Set environment variables
        run: |
          ENVIRONMENT=${{ github.event.inputs.environment }}
          if [ "$ENVIRONMENT" = "dev" ]; then
            DOMAIN_NAME=staging.healr.ng
          else
            DOMAIN_NAME="healr.ng,www.healr.ng"
          fi
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
          echo "DOMAIN_NAME=$DOMAIN_NAME" >> $GITHUB_ENV
          STACK_NAME=healr-landingpage-$ENVIRONMENT-stack
          echo "STACK_NAME=$STACK_NAME" >> $GITHUB_ENV

      - name: Check if stack exists
        id: check_stack
        run: |
          set +e
          aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].StackStatus" --output text
          if [ $? -eq 0 ]; then
            echo "EXISTS=true" >> $GITHUB_ENV
          else
            echo "EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Deploy stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.STACK_NAME }}
          template: cloudformation/template.yml
          capabilities: CAPABILITY_NAMED_IAM
          parameter-overrides: |
            Env=${{ env.ENVIRONMENT }}
            ProjectId=healr
            AttachCNAME=false

      - name: Get S3 bucket and CloudFront info
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs" --output json)
          S3_BUCKET=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="S3BucketName") | .OutputValue')
          CF_DIST_ID=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="CloudfrontDistID") | .OutputValue')
          CF_DOMAIN=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="CloudfrontDomainName") | .OutputValue')
          echo "S3_BUCKET=$S3_BUCKET" >> $GITHUB_ENV
          echo "CF_DIST_ID=$CF_DIST_ID" >> $GITHUB_ENV
          echo "CF_DOMAIN=$CF_DOMAIN" >> $GITHUB_ENV

      - name: Upload content to S3
        run: |
          aws s3 sync ./ s3://$S3_BUCKET --delete
          aws s3 cp Landingpage/.well-known/apple-app-site-association s3://$S3_BUCKET/.well-known/apple-app-site-association --content-type application/json

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id $CF_DIST_ID --paths "/*"

      - name: Print live URL
        run: |
          echo "Landing page deployed: https://$CF_DOMAIN"
