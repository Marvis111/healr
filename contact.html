<!doctype html>
<html class="no-js" lang="en">
    <head>
        <title>HealR - Home</title>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="author" content="HealR">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta name="description" content="HealR - Your trusted telemedicine platform for patients and doctors.">
        <!-- favicon icon -->
        <link rel="shortcut icon" href="assets/img/logo/fav.svg">
        <link rel="apple-touch-icon" href="assets/img/logo/fav.svg">
        <link rel="apple-touch-icon" sizes="72x72" href="assets/img/logo/fav.svg">
        
        <!-- style sheets and font icons  -->
        <link rel="stylesheet" href="assets/css/vendors.min.css">
        <link rel="stylesheet" href="assets/css/icon.min.css">
        <link rel="stylesheet" href="assets/css/style1.min.css">
        <link rel="stylesheet" href="assets/css/responsive1.min.css">
        <link rel="stylesheet" href="assets/css/landing.css">
        <style>
            .services-grid {
                gap: 2rem !important;
                row-gap: 3rem !important;
            }         
        </style>
        
    </head>
    <body>
   
    <!-- Header Component -->
    <div id="header-component"></div>
    <section class="page-title-big-typography ipad-top-space-margin cover-background background-position-center-bottom position-relative extra-big-section pb-50px sm-py-0 bg-base-footer" > 
        <div class="container">
            <div class="row align-items-center justify-content-center extra-very-small-screen">
                <div class="col-lg-6 col-md-8 position-relative text-center page-title-extra-large" data-anime='{ "el": "childs", "opacity": [0, 1], "rotateY": [-90, 0], "rotateZ": [-10, 0], "translateY": [80, 0], "translateZ": [50, 0], "staggervalue": 200, "duration": 900, "easing": "easeOutCirc" }'>
                    <h1 class=" text-off fw-700 ls-minus-2px mt-2">Talk to Us – We’re Here to Help!</h1>
                    <p class="w-80 mx-auto fw-400 fs-16 text-gray-1">Whether you’re a patient or doctor, please reach out with questions about
                        appointments, care, or partnerships. The HealR team is ready to support you.   
                    </p>
                </div>
            </div>
        </div>
    </section>

    <section class="pt-0">
        <div class="container">        
            <div class="row row-cols-md-1 justify-content-center">
                <div class="col-xl-9 overflow-hidden">
                    <!-- start contact form -->
                    <form method="post" class="row contact-form-style-02" data-anime='{ "translateX": [0, 0], "opacity": [0,1], "duration": 600, "delay": 250, "staggervalue": 300, "easing": "easeOutQuad" }'>
                        <div class="col-md-6 mb-30px">
                            <input class="input-name form-control required" id="firstName" type="text" name="name" placeholder="First Name*">
                        </div>
                        <div class="col-md-6 mb-30px">
                            <input class="input-name form-control required" id="lastName" type="text" name="name" placeholder="Last Name*">
                        </div>
                        <div class="col-md-6 mb-30px">
                            <input class="input-name form-control required" id="contactEmail" type="email" name="email" placeholder="Email*">
                        </div>
                        <div class="col-md-6 mb-30px">
                            <input class="input-name form-control required" id="phoneNumber" type="tel" name="phone" placeholder="Phone Number">
                        </div>
                        <div class="col-md-12 mb-30px">
                            <input class="input-name form-control required" id="subject_" type="text" name="subject" placeholder="Subject">
                        </div>
                        <div class="col-md-12 mb-30px">
                            <textarea class="input-name form-control required" id="contactProjectDetails" cols="40" rows="4" name="comment" placeholder="Type message here..."></textarea>
                        </div>
                        
                        <div class="col-xl-12 col-md-12 text-center sm-mt-20px">
                            <input type="button" id="emailUsBtn" class="py-1 px-5 w-max-content submit" type="submit" style="border-radius: 60px;width: max-content; outline: none; background: #394A53;color: white;" value="Submit" data-loading-text="Submitting..."/>
                        </div>
                        <div class="col-12">
                            <div class="form-results mt-20px d-none"></div>
                        </div>
                    </form>
                    <!-- end contact form -->
                </div>
            </div>
        </div>
    </section>

    <div id="footer-component"></div>

    <script type="text/javascript" src="assets/js/jquery.js"></script>
    <script data-cfasync="false"
		src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.5/dist/sweetalert2.all.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.18.0/axios.js"></script>
    <script type="text/javascript" src="assets/js/vendors.min.js"></script>
    <script type="text/javascript" src="assets/js/main.js"></script>
    <script type="text/javascript" src="assets/js/components.js"></script>
    <script type="text/javascript">
        const apiUrl =  'https://myz4vklqlabtz4mmc565eapjwi0wvntl.lambda-url.us-east-1.on.aws/';
        document.getElementById('emailUsBtn').addEventListener('click', function(event) {
	event.preventDefault(); // Prevent the default form submission

	// Get form field values
    const firstName = document.getElementById('firstName').value;
    const lastName = document.getElementById('lastName').value;
	const fullName = `${firstName} ${lastName}`;
	const email = document.getElementById('contactEmail').value;
	const subject_ = document.getElementById('subject_').value;
	const projectDetails = document.getElementById('contactProjectDetails').value;

	const clearForm = () => {
        document.getElementById('firstName').value = '';
        document.getElementById('lastName').value = '';
		document.getElementById('contactEmail').value = '';
		document.getElementById('subject_').value = '';
		document.getElementById('contactProjectDetails').value = '';
	}

	const emailUsBtn = document.getElementById('emailUsBtn');
	const originalBtnText = emailUsBtn.value;
	const loadingText = emailUsBtn.getAttribute('data-loading-text');

	// Perform validation if needed
	if (!fullName.trim() || !email.trim()  || !subject_.trim() || !projectDetails.trim()) {
		Swal.fire({
			title: 'Incomplete Form',
			text: "Please fill in all required fields.",
			icon: 'warning',
			confirmButtonColor: '#3085d6',
		});
		return;
	}

	// Set loading state
	emailUsBtn.disabled = true;
	emailUsBtn.value = loadingText;

	// Prepare form data for submission
	const formData = new FormData();
	formData.append('full_name', fullName);
	formData.append('email', email);
	formData.append('subject', subject_);
	formData.append('project_details', projectDetails);
	formData.append('email_type', "contact_us");
	// Submit form data to your server or an API using axios
	axios.post(apiUrl, formData)
		.then(_ => {
			// Handle success response (status 2xx)
			Swal.fire({
				title: 'Success!',
				text: 'Your message has been sent successfully.',
				icon: 'success',
				confirmButtonColor: '#3085d6',
				confirmButtonText: 'Great!'
			});
			clearForm();
			emailUsBtn.disabled = false;
			emailUsBtn.value = originalBtnText;
			return;
		})
		.catch(_ => {
			Swal.fire({
				title: 'Failed',
				text: 'Error submitting form. Please try again later.',
				icon: 'error',
				confirmButtonColor: '#3085d6',
			});
			emailUsBtn.disabled = false;
			emailUsBtn.value = originalBtnText;
		})
});

    </script>
    </body>
</html>
